<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#7b4bb7" />
<title>FEMUD</title>

<style>
/* === MEVCUT STİLLERİN AYNISI === */
:root{
  --lav1:#130a22;
  --lav2:#2a0f4b;
  --lav3:#3a1670;
  --lav4:#7b4bb7;
  --lav5:#b79cff;
  --card: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.14);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.70);
  --shadow: 0 18px 60px rgba(0,0,0,.45);
  --radius: 18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--text);
  background:linear-gradient(160deg,var(--lav1),var(--lav2));
}
.wrap{max-width:980px;margin:auto;padding:18px}

/* === FOTO GALERİ === */
.photos{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}
@media(min-width:760px){.photos{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.photos{grid-template-columns:1fr 1fr 1fr}}

.photoCard{
  border-radius:18px;
  overflow:hidden;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 45px rgba(0,0,0,.45);
  cursor:pointer;
  transition:transform .2s ease;
}
.photoCard:hover{transform:translateY(-4px)}

.photoCard img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.photoInfo{
  padding:14px;
}
.photoTitle{
  margin:0;
  font-size:14px;
  font-weight:800;
}
.photoDesc{
  margin-top:6px;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.45;
}

/* === BÜYÜTME (LIGHTBOX) === */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.lightbox.active{display:flex}
.lightbox img{
  max-width:92%;
  max-height:92%;
  border-radius:18px;
  box-shadow:0 0 60px rgba(183,156,255,.45);
}
</style>
</head>

<body>
<div class="wrap">

<h2>Femud Ürün Fotoğrafları</h2>

<div class="photos" id="photoGrid"></div>

</div>

<!-- BÜYÜTME ALANI -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>
/* === FOTOĞRAFLAR + AÇIKLAMALAR (BEN YAZDIM) === */
const IMAGES = [
{
  title:"Mentollü Şampuan",
  file:"26b3226d-e411-4ec8-b6d5-84a830c3a547.jpeg",
  desc:"Mentol ferahlığı sağlar. Termal su ile üretilmiştir. Günlük kullanıma uygundur. Saç derisini canlandırır."
},
{
  title:"Bitkisel Bakım Formülü",
  file:"875b9390-dec2-4305-a74a-16b47b8a2eb5.jpeg",
  desc:"Doğal özler içerir. Saçı yıpratmadan temizler. Kimyasal yükü azaltılmış formül."
},
{
  title:"Onarıcı Etkili Şampuan",
  file:"b9df6859-e595-4570-95d0-852943543fd9.jpeg",
  desc:"Yıpranmış saçlar için onarıcı etki sağlar. Saça canlılık ve parlaklık kazandırır."
},
{
  title:"Günlük Bakım Serisi",
  file:"ba498f14-42b7-4812-b68d-3d3d046337c7.jpeg",
  desc:"Hassas saç tipleri için uygundur. Saçın doğal dengesini korumaya yardımcı olur."
},
{
  title:"Doğal İçerikli Bakım",
  file:"d3ec26d3-c005-4e7d-98eb-e52cec3bd15f.jpeg",
  desc:"Yerli üretim. Doğadan ilham alan içerikler. Uzun süreli ferahlık hissi verir."
}
];

const grid=document.getElementById("photoGrid");

IMAGES.forEach(p=>{
  const card=document.createElement("div");
  card.className="photoCard";
  card.innerHTML=`
    <img src="images/${p.file}" alt="${p.title}">
    <div class="photoInfo">
      <p class="photoTitle">${p.title}</p>
      <p class="photoDesc">${p.desc}</p>
    </div>
  `;
  card.onclick=()=>openLightbox("images/"+p.file);
  grid.appendChild(card);
});

/* === BÜYÜT / KAPAT === */
function openLightbox(src){
  document.getElementById("lightboxImg").src=src;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("active");
}
</script>
</body>
</html>
