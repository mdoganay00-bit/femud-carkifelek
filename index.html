<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#7b4bb7" />
  <title>FEMUD</title>

  <style>
    :root{
      --lav1:#130a22;
      --lav2:#2a0f4b;
      --lav3:#3a1670;
      --lav4:#7b4bb7;
      --lav5:#b79cff;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(183,156,255,.28), transparent 55%),
        radial-gradient(900px 650px at 80% 20%, rgba(123,75,183,.34), transparent 60%),
        linear-gradient(160deg, var(--lav1), var(--lav2) 40%, #0b0616);
      overflow-x:hidden;
    }

    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 34px}

    .top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
    .brand{display:flex;align-items:center;gap:14px}
    .badge{width:58px;height:58px;border-radius:999px;display:grid;place-items:center;border:2px solid rgba(183,156,255,.55)}
    .logoText{font-weight:900;letter-spacing:.1em}
    .title{margin:0;font-size:18px}
    .subtitle{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
    .pill{padding:10px 12px;border-radius:999px;border:1px solid var(--stroke)}

    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}

    .card{border-radius:var(--radius);background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)}
    .cardInner{padding:16px}
    .cardTitle{margin:0;font-size:16px}
    .cardDesc{margin-top:8px;font-size:13px;color:var(--muted)}

    .btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-weight:700;cursor:pointer}
    .btnPrimary{background:linear-gradient(135deg, rgba(183,156,255,.30), rgba(123,75,183,.18))}

    .page{display:none;margin-top:12px}
    .page.active{display:block}

    .pageHeader{display:flex;justify-content:space-between;margin:10px 0 12px}
    .backBtn{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff}

    /* FOTO GALERİ */
    .photos{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    @media(min-width:860px){
      .photos{grid-template-columns:1fr 1fr 1fr}
    }
    .photoCard{
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.25);
      box-shadow:0 12px 40px rgba(0,0,0,.4);
    }
    .photoCard img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .footer{margin-top:16px;font-size:12px;color:rgba(255,255,255,.55);text-align:center}
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="badge"><div class="logoText">FEMUD</div></div>
      <div>
        <h1 class="title">FEMUD</h1>
        <p class="subtitle">Doğadan gelen güç</p>
      </div>
    </div>
    <div class="pill" id="statusPill">Hazır</div>
  </div>

  <!-- HOME -->
  <section class="page active" id="home">
    <div class="grid">

      <div class="card">
        <div class="cardInner">
          <h3 class="cardTitle">Femud Ürün Videoları</h3>
          <p class="cardDesc">Ürün videolarını izleyin.</p>
          <button class="btn btnPrimary" onclick="go('products')">Videolar</button>
        </div>
      </div>

      <!-- 🔥 YENİ KART -->
      <div class="card">
        <div class="cardInner">
          <h3 class="cardTitle">Femud Ürün Fotoğrafları</h3>
          <p class="cardDesc">Ürün görsellerini inceleyin.</p>
          <button class="btn btnPrimary" onclick="go('photos')">Fotoğrafları Aç</button>
        </div>
      </div>

    </div>
    <div class="footer">© FEMUD</div>
  </section>

  <!-- FOTOĞRAFLAR -->
  <section class="page" id="photos">
    <div class="pageHeader">
      <h2>Femud Ürün Fotoğrafları</h2>
      <button class="backBtn" onclick="go('home')">Ana sayfa</button>
    </div>
    <div class="photos" id="photoGrid"></div>
  </section>

</div>

<script>
  const IMAGES = [
    "urun1.jpg",
    "urun2.jpg",
    "urun3.jpg",
    "urun4.jpg",
    "urun5.jpg"
  ];

  function go(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderPhotos(){
    const g=document.getElementById("photoGrid");
    g.innerHTML="";
    IMAGES.forEach(i=>{
      const d=document.createElement("div");
      d.className="photoCard";
      d.innerHTML=`<img src="images/${i}" alt="Femud Ürün">`;
      g.appendChild(d);
    });
  }

  renderPhotos();
  document.getElementById("statusPill").textContent="Güven • Natürel • Sağlık";
</script>

</body>
</html>
